name: TV Smoke (free)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'app/src/**'
      - 'gradle/libs.versions.toml'
      - '.github/workflows/tv-smoke.yml'

concurrency:
  group: tv-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tv-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Enable KVM for emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Start fake video server for playback test
        run: |
          mkdir -p /tmp/www
          if command -v ffmpeg >/dev/null 2>&1; then
            ffmpeg -y -loglevel error -f lavfi -i testsrc=duration=30:size=1280x720:rate=30 -f lavfi -i sine=frequency=440:duration=30 -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest /tmp/www/BigBuckBunny.mp4
          else
            curl -sL -o /tmp/www/BigBuckBunny.mp4 https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4
          fi
          ls -l /tmp/www/
          nohup python3 -m http.server 18080 --directory /tmp/www >/tmp/http-server.log 2>&1 &
          sleep 2
          curl -sI http://127.0.0.1:18080/BigBuckBunny.mp4 | head -n 5

      - name: Run TV emulator smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: android-tv
          arch: x86
          profile: tv_1080p
          cores: 4
          ram-size: 4096M
          heap-size: 512M
          disable-animations: true
          disable-linux-hw-accel: false
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-audio -no-boot-anim
          script: |
            adb wait-for-device
            adb shell settings put global window_animation_scale 0 || true
            adb shell settings put global transition_animation_scale 0 || true
            adb shell settings put global animator_duration_scale 0 || true
            ./gradlew --no-daemon :app:connectedGithubDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.neilturner.aerialviews.ui.screensaver.ScreensaverYouTubeBehaviorTest; TEST_EXIT=$?
            adb exec-out screencap -p > /tmp/tv-frame.png || true
            adb logcat -d > /tmp/logcat.txt || true
            exit $TEST_EXIT

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tv-smoke
          path: |
            /tmp/tv-frame.png
            /tmp/logcat.txt
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
