name: TV Smoke (free)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'app/src/**'
      - 'gradle/libs.versions.toml'
      - '.github/workflows/tv-smoke.yml'

concurrency:
  group: tv-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tv-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Run TV emulator smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: android-tv
          arch: x86
          profile: tv_1080p
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-audio -no-boot-anim
          script: |
            adb wait-for-device
            adb shell settings put global window_animation_scale 0 || true
            adb shell settings put global transition_animation_scale 0 || true
            adb shell settings put global animator_duration_scale 0 || true
            ./gradlew --no-daemon :app:connectedGithubDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.neilturner.aerialviews.ui.screensaver.ScreensaverYouTubeBehaviorTest
            adb exec-out screencap -p > /tmp/tv-frame.png || true
            adb logcat -d > /tmp/logcat.txt || true

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tv-smoke
          path: |
            /tmp/tv-frame.png
            /tmp/logcat.txt
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
